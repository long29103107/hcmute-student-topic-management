<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · HCMUTE Student Topic Management</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>
<body class="auth-page">
<main class="card">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">T</span>
        <div><strong>HCMUTE Student Topic Management</strong><span>Student topic management portal</span></div>
    </div>
    <h1>Sign in</h1>

    <div class="message" th:if="${loginError}">Incorrect username or password.</div>
    <div class="message success" th:if="${loggedOut}">You have been signed out.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="login-options">
            <label class="remember-option" for="remember-me" th:if="${rememberMeEnabled}">
                <input id="remember-me" name="remember-me" type="checkbox">
                <span>Remember me</span>
            </label>
            <a class="forgot-link" th:href="@{/forgot-password}">Forgot password?</a>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Sign in</button>
    </form>

    <div class="oauth-divider" th:if="${googleLoginEnabled}"><span>OR</span></div>
    <a class="google-button" th:if="${googleLoginEnabled}" th:href="@{/oauth2/authorization/google}">
        <span class="google-mark" aria-hidden="true">G</span>
        <span>Sign in with Google</span>
    </a>

    <p class="note">Sign in with your assigned account. Contact an administrator if you need assistance.</p>
</main>
</body>
</html>
