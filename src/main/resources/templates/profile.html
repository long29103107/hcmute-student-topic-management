<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><head><title>My Profile</title></head><body>
<main layout:fragment="content" class="mx-auto max-w-4xl px-4 py-8 sm:px-6 lg:px-8"><section class="max-w-2xl rounded-lg border border-gray-200 bg-white p-6 shadow-sm sm:p-8"><p class="mb-2 text-xs font-semibold uppercase tracking-widest text-orange-500">My Profile</p><h1 class="text-3xl font-bold tracking-tight text-gray-900">Account information</h1><p class="mt-3 text-sm leading-6 text-gray-500">Account details and current role.</p><div class="mt-6 flex items-center gap-4 rounded-lg border border-blue-100 bg-blue-50 p-4"><span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-blue-700 font-bold text-white" th:text="${#authentication.principal.initials}">SA</span><div class="min-w-0"><strong class="block truncate text-sm font-semibold text-gray-900" th:text="${#authentication.principal.fullName}">System Administrator</strong><span class="mt-1 block text-sm text-blue-700" th:text="${#authentication.principal.primaryRoleName}">Administrator</span><span class="mt-1 block text-xs text-gray-500">You are signed in</span></div></div></section></main>
</body></html>
