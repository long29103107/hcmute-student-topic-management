<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<head>
    <title>My Profile</title>
</head>
<body>
    <main layout:fragment="content" class="profile-main">
        <section class="panel profile-card">
            <p class="eyebrow">My Profile</p>
            <h1>Account information</h1>
            <p class="profile-subtitle">Account details and current role.</p>
            <div class="profile-row">
                <span class="avatar" th:text="${#authentication.principal.initials}">SA</span>
                <div>
                    <strong th:text="${#authentication.principal.fullName}">System Administrator</strong>
                    <span th:text="${#authentication.principal.primaryRoleName}">Administrator</span>
                    <span>You are signed in</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
