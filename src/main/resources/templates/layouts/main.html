<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$LAYOUT_TITLE · $CONTENT_TITLE">HCMUTE Student Topic Management</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/vendor/flowbite.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="app-layout bg-gray-50 text-gray-900 antialiased">
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

<div class="transition-[margin-left] duration-300 md:ml-64" data-app-shell>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="pointer-events-none fixed end-4 top-20 z-[60] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-3 sm:end-6" aria-live="polite" aria-atomic="true" data-toast-region>
        <div th:replace="~{fragments/toast :: toast(type='success', title='Success', message=${successMessage}, toastId='success-toast', duration=5)}"></div>
        <div th:replace="~{fragments/toast :: toast(type='warning', title='Warning', message=${warningMessage}, toastId='warning-toast', duration=6)}"></div>
        <div th:replace="~{fragments/toast :: toast(type='error', title='Error', message=${errorMessage}, toastId='error-toast', duration=8)}"></div>
    </div>

    <main layout:fragment="content"></main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
