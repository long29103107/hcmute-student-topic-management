<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar" aria-label="Main navigation" th:fragment="sidebar">
    <a class="brand" th:href="@{/dashboard}" aria-label="Go to dashboard">
        <span class="brand-mark" aria-hidden="true">TM</span>
        <span>
            <span class="brand-name">Topic Manager</span><br/>
            <span class="brand-caption">HCMUTE Student Portal</span>
        </span>
    </a>

    <nav class="sidebar-nav pt-2">
        <a th:href="@{/dashboard#overview}" th:aria-current="${pageTitle == 'Dashboard' ? 'page' : null}">
            <span class="sidebar-icon">▦</span><span>Dashboard</span>
        </a>
    </nav>

    <p class="sidebar-label" sec:authorize="hasRole('ADMIN')">Administration</p>
    <nav class="sidebar-nav" sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin/roles}"
           th:aria-current="${pageTitle == 'Role permissions' or pageTitle == 'Manage permissions' ? 'page' : null}">
            <span class="sidebar-icon">⚿</span><span>Roles &amp; permissions</span>
        </a>
    </nav>
</aside>
</body>
</html>
