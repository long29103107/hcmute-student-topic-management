<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <div
      th:fragment="statusModal(modalId, formAction, userName, active)"
      th:id="${modalId}"
      tabindex="-1"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      class="fixed inset-0 z-50 hidden h-full w-full overflow-y-auto overflow-x-hidden bg-gray-900/50 p-4 md:inset-0"
    >
      <div class="relative mx-auto my-8 w-full max-w-md">
        <div class="relative rounded-lg border border-gray-200 bg-white shadow-sm">
          <button
            type="button"
            class="absolute end-4 top-4 z-10 inline-flex h-8 w-8 items-center justify-center rounded-lg text-sm text-gray-400 hover:bg-gray-100 hover:text-gray-900"
            th:attr="data-modal-hide=${modalId}"
            aria-label="Close"
          >
            <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 12 12M13 1 1 13" />
            </svg>
          </button>

          <div class="border-b border-gray-200 px-6 py-5 pe-16">
            <h2 class="text-xl font-semibold text-gray-900" th:text="${active ? 'Lock account?' : 'Unlock account?'}">Lock account?</h2>
          </div>

          <div class="mx-6 mt-5 rounded-lg p-4 text-sm leading-5" th:classappend="${active ? 'bg-yellow-50 text-yellow-800' : 'bg-blue-50 text-blue-800'}">
            <span th:if="${active}">This account will be unable to sign in until it is unlocked again.</span>
            <span th:unless="${active}">This account will be allowed to sign in again.</span>
          </div>

          <form th:id="${modalId + '-form'}" th:action="${formAction}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          </form>

          <div class="flex justify-end gap-3 border-t border-gray-200 px-6 py-5">
            <button type="button" class="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100" th:attr="data-modal-hide=${modalId}">Cancel</button>
            <button type="submit" class="status-action-button" th:attr="form=${modalId + '-form'}" th:text="${active ? 'Lock account' : 'Unlock account'}">Lock account</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
