<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="announcement-panel">
    <section class="mt-6 rounded-lg border border-gray-200 bg-white p-6 shadow-sm" aria-labelledby="announcements-heading">
        <div class="mb-5 flex flex-col justify-between gap-3 sm:flex-row sm:items-start">
            <div>
                <p class="mb-1 text-xs font-semibold uppercase tracking-widest text-orange-500">Announcements</p>
                <h2 id="announcements-heading" class="text-xl font-semibold text-gray-900">Latest updates</h2>
                <p class="mt-1 text-sm text-gray-500">Published notices visible to your account.</p>
            </div>
            <a class="text-sm font-semibold text-blue-700 hover:text-blue-800 hover:underline" th:href="@{/announcements}">View all</a>
        </div>
        <div class="grid gap-3 lg:grid-cols-2" th:if="${!#lists.isEmpty(announcements)}">
            <article class="rounded-lg border border-gray-100 bg-gray-50 p-4" th:each="announcement : ${announcements}">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="inline-flex items-center rounded-full bg-blue-100 px-2.5 py-1 text-xs font-medium text-blue-800"
                          th:text="${announcement.scopeCode == 'SCHOOL' ? 'School-wide' : announcement.departmentCode}">School-wide</span>
                    <time class="text-xs text-gray-500" th:if="${announcement.publishedAt != null}"
                          th:text="${#temporals.format(announcement.publishedAt, 'dd/MM/yyyy HH:mm')}">06/09/2026 09:00</time>
                </div>
                <h3 class="mt-3 text-base font-semibold text-gray-900" th:text="${announcement.title}">Announcement title</h3>
                <p class="mt-2 line-clamp-3 whitespace-pre-line text-sm leading-6 text-gray-600" th:text="${announcement.content}">Announcement content.</p>
            </article>
        </div>
        <div class="rounded-lg border border-dashed border-gray-300 bg-gray-50 px-5 py-8 text-center" th:if="${#lists.isEmpty(announcements)}">
            <h3 class="text-base font-semibold text-gray-900">No published announcements</h3>
            <p class="mt-1 text-sm text-gray-500">There are no announcements available for your scope yet.</p>
        </div>
    </section>
</th:block>
</body>
</html>
