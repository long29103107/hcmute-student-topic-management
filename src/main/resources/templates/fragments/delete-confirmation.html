<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="deleteModal(modalId, formAction, userName, accountType)" th:id="${modalId}" tabindex="-1" aria-hidden="true" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden h-full w-full overflow-y-auto overflow-x-hidden bg-gray-900/50 p-4 md:inset-0">
    <div class="relative mx-auto my-8 w-full max-w-md">
        <div class="relative rounded-lg border border-gray-200 bg-white shadow-sm">
            <button type="button" class="absolute end-4 top-4 z-10 inline-flex h-8 w-8 items-center justify-center rounded-lg text-sm text-gray-400 hover:bg-gray-100 hover:text-gray-900" th:attr="data-modal-hide=${modalId}" aria-label="Close">
                <svg class="h-3 w-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 12 12M13 1 1 13"/></svg>
            </button>
            <div class="border-b border-gray-200 px-6 py-5 pe-16">
                <h2 class="text-xl font-semibold text-gray-900">Delete account?</h2>
                <p class="mt-2 text-sm text-gray-500">You are about to permanently delete the <span th:text="${accountType}">user</span> account for <span class="font-medium text-gray-700" th:text="${userName}">this account</span>.</p>
            </div>
            <div class="mx-6 mt-5 rounded-lg bg-red-50 p-4 text-sm leading-5 text-red-800">This action cannot be undone. Accounts referenced by existing academic records cannot be deleted; lock the account instead.</div>
            <form class="p-6" th:action="${formAction}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="flex justify-end gap-3 border-t border-gray-200 pt-5"><button type="button" class="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-100" th:attr="data-modal-hide=${modalId}">Cancel</button><button type="submit" class="rounded-lg bg-red-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-red-700">Delete account</button></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
