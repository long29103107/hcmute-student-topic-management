<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="header">
    <div class="breadcrumb" aria-label="Breadcrumb">
        <span>HCMUTE Topic Management</span>
        <b>/</b>
        <strong th:text="${pageTitle ?: 'Dashboard'}">Dashboard</strong>
    </div>
    <div class="topbar-actions">
        <button class="icon-button" type="button" onclick="window.location.reload()" aria-label="Refresh page" title="Refresh">⟳</button>
        <details class="account-menu" sec:authorize="isAuthenticated()">
            <summary class="account-summary" aria-label="Mở menu tài khoản">
                <span class="avatar" sec:authentication="name">U</span>
                <span class="account-copy">
                    <strong sec:authentication="name">user</strong>
                    <small>Tài khoản</small>
                </span>
                <span class="chevron" aria-hidden="true">⌄</span>
            </summary>
            <div class="account-dropdown">
                <a th:href="@{/profile}">My Profile</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">Đăng xuất</button>
                </form>
            </div>
        </details>
    </div>
</header>
</body>
</html>
