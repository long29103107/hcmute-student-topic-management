<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="topbar" th:fragment="header">
    <div class="breadcrumb" aria-label="Breadcrumb">
        <span>HCMUTE Topic Management</span>
        <b>/</b>
        <strong th:text="${pageTitle ?: 'Dashboard'}">Dashboard</strong>
    </div>
    <div class="topbar-actions">
        <button class="icon-button" type="button" data-action="reload" aria-label="Refresh page" title="Refresh">⟳</button>
        <details class="account-menu" sec:authorize="isAuthenticated()">
            <summary class="account-summary" aria-label="Open account menu">
                <span class="avatar" th:text="${#authentication.principal.initials}">SA</span>
                <span class="account-copy">
                    <strong th:text="${#authentication.principal.fullName}">System Administrator</strong>
                    <small th:text="${#authentication.principal.primaryRoleName}">Administrator</small>
                </span>
                <span class="chevron" aria-hidden="true">⌄</span>
            </summary>
            <div class="account-dropdown">
                <a th:href="@{/profile}">My Profile</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit">Sign out</button>
                </form>
            </div>
        </details>
    </div>
</header>
</body>
</html>
