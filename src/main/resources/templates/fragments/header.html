<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="sticky top-0 z-30 border-b border-gray-200 bg-white/95 shadow-sm backdrop-blur" th:fragment="header">
    <div class="flex min-h-16 items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
        <div class="flex min-w-0 items-center gap-3">
            <button type="button"
                    class="inline-flex items-center rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 md:hidden"
                    data-drawer-target="default-sidebar" data-drawer-toggle="default-sidebar" aria-controls="default-sidebar">
                <span class="sr-only">Open navigation</span>
                <svg class="h-6 w-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <button id="sidebar-collapse-toggle" type="button"
                    class="hidden items-center rounded-lg p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 md:inline-flex"
                    data-sidebar-toggle aria-controls="default-sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
                <span class="sr-only" data-sidebar-toggle-label>Collapse sidebar</span>
                <svg class="h-6 w-6 transition-transform duration-300" data-sidebar-toggle-icon aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
                </svg>
            </button>
        </div>

        <div class="flex items-center gap-2" sec:authorize="isAuthenticated()">
            <button class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 bg-white text-xl text-blue-700 hover:bg-gray-50 focus:outline-none focus:ring-4 focus:ring-blue-100"
                    type="button" data-action="reload" aria-label="Refresh page" title="Refresh">↻</button>
            <button type="button"
                    class="flex rounded-full bg-gray-100 text-sm focus:ring-4 focus:ring-blue-100"
                    id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown">
                <span class="sr-only">Open user menu</span>
                <span class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-700 font-bold text-white" th:text="${#authentication.principal.initials}">SA</span>
            </button>
            <div class="z-50 my-4 hidden w-56 list-none divide-y divide-gray-100 rounded-lg bg-white text-base shadow-lg" id="user-dropdown">
                <div class="px-4 py-3">
                    <span class="block truncate text-sm font-semibold text-gray-900" th:text="${#authentication.principal.fullName}">System Administrator</span>
                    <span class="block truncate text-sm text-gray-500" th:text="${#authentication.principal.primaryRoleName}">Administrator</span>
                </div>
                <ul class="py-2" aria-labelledby="user-menu-button">
                    <li><a class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" th:href="@{/profile}">My Profile</a></li>
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button class="block w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100" type="submit">Sign out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
</body>
</html>
