<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 · Service unavailable</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body class="error-page error-page--yellow">
<div class="error-page__shell">
    <header class="error-page__brand">
        <span class="error-page__brand-mark">TM</span>
        <span class="error-page__brand-copy"><strong>HCMUTE Student Topic Management</strong><span>Student topic management portal</span></span>
    </header>
    <main class="error-page__card" aria-labelledby="error-title">
        <div class="error-page__topline"><p class="error-page__eyebrow">Service unavailable</p><span class="error-page__status-dot" aria-hidden="true"></span></div>
        <div class="error-page__code-row"><div class="error-page__code" aria-hidden="true">503</div><div class="error-page__signal" aria-hidden="true"></div></div>
        <div class="error-page__copy"><p class="error-page__eyebrow">HTTP ERROR</p><h1 id="error-title">We'll be back shortly.</h1><p>The service is temporarily unavailable, possibly because of maintenance or high traffic.</p></div>
        <div class="error-page__actions"><a class="error-page__button error-page__button--primary" th:href="@{/}">Try again</a></div>
        <p class="error-page__hint">Please wait a moment and refresh the page.</p>
    </main>
</div>
</body>
</html>
