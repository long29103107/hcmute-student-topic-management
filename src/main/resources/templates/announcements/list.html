<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <head>
    <title>Announcements</title>
  </head>
  <body>
    <main
      layout:fragment="content"
      class="w-full min-w-0 px-4 py-6 sm:px-6 lg:px-8"
    >
      <section aria-labelledby="page-title">
        <div
          class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"
        >
          <div>
            <p
              class="mb-2 text-xs font-semibold uppercase tracking-widest text-orange-500"
            >
              Workspace / Updates
            </p>
            <h1
              id="page-title"
              class="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl"
            >
              Announcements
            </h1>
          </div>
          <span
            class="inline-flex w-fit items-center rounded-full bg-blue-100 px-3 py-1.5 text-sm font-medium text-blue-800"
            th:text="${#lists.size(announcements) + ' published'}"
            >0 published</span
          >
        </div>
        <div
          class="space-y-4"
          th:if="${!#lists.isEmpty(announcements)}"
        >
          <article
            class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm sm:p-6"
            th:each="announcement : ${announcements}"
          >
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span
                class="inline-flex items-center rounded-full bg-blue-100 px-2.5 py-1 text-xs font-medium text-blue-800"
                th:text="${announcement.scopeCode == 'SCHOOL' ? 'School-wide' : announcement.departmentName}"
                >School-wide</span
              >
              <span
                class="text-xs text-gray-500"
                th:text="${'Published by ' + announcement.authorName + (announcement.publishedAt != null ? ' at ' + #temporals.format(announcement.publishedAt, 'dd/MM/yyyy HH:mm') : '')}"
              >
                Published by System Administrator at 06/09/2026 09:00
              </span>
            </div>
            <h2
              class="mt-3 text-xl font-semibold text-gray-900"
              th:text="${announcement.title}"
            >
              Announcement title
            </h2>
            <p
              class="mt-3 whitespace-pre-line text-sm leading-6 text-gray-600"
              th:text="${announcement.content}"
            >
              Announcement content.
            </p>
          </article>
        </div>
        <div
          class="rounded-lg border border-dashed border-gray-300 bg-white px-6 py-16 text-center shadow-sm"
          th:if="${#lists.isEmpty(announcements)}"
        >
          <div
            class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-gray-100 text-gray-400"
            aria-hidden="true"
          >
            <span class="text-2xl">—</span>
          </div>
          <h2 class="text-lg font-semibold text-gray-900">No data</h2>
          <p class="mt-2 text-sm text-gray-500">
            There are no published announcements to display.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
