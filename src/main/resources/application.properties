spring.application.name=hcmute-student-topic-management

# Local first-look/debug database. Override these properties with MySQL settings
# when the real database is available.
spring.datasource.url=jdbc:h2:mem:topicmanagement;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
