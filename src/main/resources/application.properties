spring.application.name=hcmute-student-topic-management

# Local development database.
# If root has a password, fill it in locally and do not commit that value.
server.port=5000

# Report bytes are stored outside the database. The service validates these
# values before writing report metadata.
reports.storage.directory=${REPORT_STORAGE_DIRECTORY:storage/reports}
reports.upload.max-size-bytes=${REPORT_UPLOAD_MAX_SIZE_BYTES:10485760}
reports.upload.max-files=${REPORT_UPLOAD_MAX_FILES:10}
reports.upload.allowed-content-types=${REPORT_UPLOAD_ALLOWED_CONTENT_TYPES:application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document}
spring.servlet.multipart.max-file-size=${REPORT_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${REPORT_UPLOAD_MAX_REQUEST_SIZE:110MB}

# MVP evaluator scoring scale. The Service enforces this range server-side.
evaluation.score.min=${EVALUATION_SCORE_MIN:0}
evaluation.score.max=${EVALUATION_SCORE_MAX:10}

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hcmute_topic_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789a
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
# The revised schema is created explicitly by database/1.ddl.sql; local fixtures
# are created through the local /seed pipeline. The admin reset/reseed endpoint
# is POST /api/admin/seed.
# This also keeps local MySQL 9.7 from being probed by Flyway before migrations exist.
spring.flyway.enabled=false

# Local development allows the seed migration page/API before the first admin
# exists. Set SEED_PUBLIC_ENABLED=false on shared, staging or production hosts.
seed.public-enabled=${SEED_PUBLIC_ENABLED:true}

# Google sign-in is optional and enabled only when OAuth credentials are provided.
google.oauth.enabled=${GOOGLE_OAUTH_ENABLED:false}
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.allowed-domains=${GOOGLE_OAUTH_ALLOWED_DOMAINS:}

# Remember-me is opt-in and requires a strong runtime-only key.
security.remember-me.enabled=${REMEMBER_ME_ENABLED:false}
security.remember-me.key=${REMEMBER_ME_KEY:}
security.remember-me.token-validity-seconds=${REMEMBER_ME_VALIDITY_SECONDS:1209600}

# Session identifiers are cookie-only and are not readable by browser scripts.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Do not expose exception details through the default error endpoint.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.thymeleaf.cache=false
