spring.application.name=hcmute-student-topic-management

# H2 remains the default for a quick first-look run and automated tests.
# Set DB_URL, DB_USERNAME, DB_PASSWORD and DB_DRIVER to use MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:topicmanagement;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=none
# The MVP schema is created explicitly by database/ddl.sql and database/seed.sql.
# This also keeps local MySQL 9.7 from being probed by Flyway before migrations exist.
spring.flyway.enabled=false
