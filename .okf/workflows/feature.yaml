name: feature
description: Add a capability while preserving Spring MVC, REST adapter and Java monolith boundaries.
agents:
  - leader
  - planner
  - developer
  - reviewer
  - qa
steps:
  - id: clarify
    owner: leader
    action: Read PRODUCT_VISION.md, then define an outcome inside its active milestone, affected role, explicit scope boundary and acceptance criteria.
  - id: plan
    owner: planner
    action: Add a Vision alignment section and identify the smallest active-phase task, domain rules, routes, service/persistence boundaries, views and verification.
  - id: implement
    owner: developer
    action: Add the smallest complete slice using Spring MVC, JSP/JSTL, REST DTOs, JDBC/MySQL and server-side validation.
  - id: review
    owner: reviewer
    action: Check layer boundaries, authorization, transactions, prepared SQL, XSS/upload handling and scope drift.
  - id: verify
    owner: qa
    action: Run focused tests, mvn test/package and MySQL/Tomcat smoke checks relevant to the slice.
done_when:
  - The intended role can complete the flow through SSR/REST adapters or the durable service contract exists.
  - Business rules are enforced on the server and documented.
  - Relevant checks pass or failures are explicitly reported.
