services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: hcmute-student-topic-management:local

    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5000:5000"

    volumes:
      - report_storage:/app/storage/reports

    restart: unless-stopped

volumes:
  report_storage: