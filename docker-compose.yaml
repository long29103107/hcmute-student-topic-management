services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: hcmute-student-topic-management:local

    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://127.0.0.1:3306/hcmute_topic_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}

    ports:
      - "5000:5000"

    volumes:
      - report_storage:/app/storage/reports

    restart: unless-stopped

volumes:
  report_storage:
